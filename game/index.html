<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Ledger — a heist game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07090f;
    color: #e8ecf5;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.2em;
    margin: 14px 0 8px;
    color: #ffd94d;
  }
  canvas {
    background: #1d2333;
    border: 1px solid #2c3550;
    image-rendering: pixelated;
  }
  p {
    font-size: 13px;
    color: #8b93a7;
    margin: 10px 0 0;
  }
</style>
</head>
<body>
<h1>MIDNIGHT LEDGER</h1>
<canvas id="game"></canvas>
<p>WASD / arrows to move &middot; Shift to sneak &middot; click to walk &middot; Q smoke &middot; E EMP &middot; R restart</p>
<script>
  // Screenshot mode (?bare=1): hide the page chrome so the capture is
  // exactly the game's own canvas, nothing else.
  if (new URLSearchParams(window.location.search).get('bare') === '1') {
    document.querySelector('h1').style.display = 'none';
    document.querySelector('p').style.display = 'none';
    document.body.style.margin = '0';
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
